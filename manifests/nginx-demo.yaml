apiVersion: v1
kind: Namespace
metadata:
  name: nginx-demo
  labels:
    app.kubernetes.io/part-of: velero-backup-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-content
  namespace: nginx-demo
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: velero-backup-demo
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>Velero Backup Demo</title>
      </head>
      <body>
        <h1>AKS Velero backup demonstration</h1>
        <p>This page is provided by the nginx-content ConfigMap.</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx-demo
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: velero-backup-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/part-of: velero-backup-demo
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: nginx-content
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: nginx-demo
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: velero-backup-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
